name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        # The gateway extra is here so gateway/main.py's request contract is
        # actually exercised: it is the only module needing it, and until the
        # area query landed nothing in CI imported it at all.
        run: python -m pip install -e .[deepcase,gateway]
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Publication allowlist matches the distribution policy
        # The allowlist is generated, so a hand edit is the way someone would
        # widen the public surface without touching the policy. Regenerating
        # here and diffing makes that edit fail CI instead of shipping.
        run: python scripts/publication_boundary.py plan --check
      - name: Documentation path anchors resolve
        # The failure this catches is docs/architecture.md pointing at
        # src/disasterpilot/ for four days after the package was renamed: a
        # path asserted in prose with nothing to check it. Scope includes the
        # source files that cite documentation paths, because two of those
        # went stale in the 2026-08-23 folder move.
        run: >-
          python scripts/manual_anchors.py check
          docs README.md src/geosteward/live/__init__.py

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .[deepcase]
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      - name: Run app unit tests
        run: npm test
        working-directory: app
      - name: Build PWA (includes artifact sync)
        run: npm run build
        working-directory: app
      - name: Publication boundary holds for the built app
        # Checks the artifact about to ship, not the intent that produced it:
        # if sync-artifacts.mjs ever regresses to copying directories, this is
        # what catches it.
        run: python scripts/publication_boundary.py verify app/dist
