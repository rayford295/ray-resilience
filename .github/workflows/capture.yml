name: capture-track

on:
  schedule:
    # Every 3 hours while Bavi is active; disable after the event closes.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture live track snapshot
        run: python scripts/fetch_bavi_track.py --output-dir data/snapshots
      - name: Commit snapshot if changed
        run: |
          git config user.name "bavi-capture-bot"
          git config user.email "actions@github.com"
          git add data/snapshots
          git diff --cached --quiet || git commit -m "Auto-capture Bavi track snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
