[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosteward"
version = "1.0.0.dev1"
description = "GeoSteward: an accountable GeoAI risk analyst for location-based resilience understanding and decision-making. OASIS @ ACM SIGSPATIAL 2026 Track A."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yifan Yang" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
deepcase = ["h3>=4.0"]
geo = [
  "numpy>=1.26",
  "pandas>=2.0",
  "shapely>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geosteward = ["harness/*.yaml"]
