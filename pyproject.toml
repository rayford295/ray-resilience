[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disasterpilot"
version = "0.2.0"
description = "Multi-agent pipeline from public disaster information to auditable decisions — pre-event watch to post-event evidence. Case study: Super Typhoon Bavi (2026), OASIS @ ACM SIGSPATIAL 2026 Track A."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yifan Yang" }]
dependencies = []

[project.optional-dependencies]
geo = [
  "numpy>=1.26",
  "pandas>=2.0",
  "shapely>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
