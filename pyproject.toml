[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosteward"
version = "0.1.0.dev1"
description = "Ray Resilience: an accountable GeoAI system for place-based disaster intelligence (resilience intelligence for every place). The Python package keeps the geosteward name. OASIS @ ACM SIGSPATIAL 2026 Track A."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yifan Yang" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
deepcase = ["h3>=4.0"]
gateway = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]
geo = [
  "numpy>=1.26",
  "pandas>=2.0",
  "shapely>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geosteward = ["harness/*.yaml"]
